.bgp:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,.25) 0%,rgba(10,10,11,.72) 45%,var(--bg) 92%)}
html.light .bgp:after{background:linear-gradient(180deg,rgba(243,241,236,.15) 0%,rgba(243,241,236,.8) 45%,var(--bg) 90%)}
body.vA .bgp{opacity:.95}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(800px 420px at 90% -10%,rgba(207,176,122,.14),transparent 60%)}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 16px 110px}

/* splash */
#splash{position:fixed;inset:0;z-index:50;background:#070708;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
.gauge{width:150px;height:75px;position:relative;overflow:hidden}
.gauge:before{content:"";position:absolute;inset:0 0 -75px 0;border-radius:50%;border:5px solid #26262b;border-bottom-color:transparent}
.needle{position:absolute;left:50%;bottom:0;width:3px;height:64px;background:linear-gradient(#cfb07a,#fff2d1);transform-origin:50% 100%;transform:translateX(-50%) rotate(-90deg);border-radius:4px;animation:rev 1.4s cubic-bezier(.3,1.4,.5,1) forwards;box-shadow:0 0 14px rgba(207,176,122,.8)}
.gauge i{position:absolute;left:50%;bottom:-8px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff}
@keyframes rev{60%{transform:translateX(-50%) rotate(70deg)}100%{transform:translateX(-50%) rotate(35deg)}}
#sname{direction:ltr;font-family:Inter,sans-serif;font-weight:800;font-size:24px;letter-spacing:6px;color:#fff;min-height:32px}
#sname:after{content:"|";color:#cfb07a;animation:bl .7s infinite;margin-left:2px}
@keyframes bl{50%{opacity:0}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;direction:ltr}
.brand b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-family:Inter;font-weight:800;font-size:12px;letter-spacing:1px}
.brand span{font-family:Inter;font-weight:800;letter-spacing:4px;font-size:13px}
.tools{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);height:36px;min-width:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--txt);cursor:pointer;display:grid;place-items:center}
.chip svg{width:17px;height:17px}

/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}

body.vB .av{box-shadow:0 0 0 3px #0a0a0b,0 0 0 4px #cfb07a}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(207,176,122,.5);color:var(--gold2);background:rgba(207,176,122,.1);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.3px;margin-bottom:10px}
body.vB .pill{color:#e9d5a8}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.hello{color:var(--gold);font-size:14px;font-weight:700;margin-bottom:2px}
body.vB .hello{color:#cfb07a}
h1{font-size:36px;font-weight:900;line-height:1.15;display:flex;align-items:center;gap:8px}
h1 svg{width:24px;height:24px;flex:none}
.role{color:var(--mut);font-size:15px;margin-top:6px;font-weight:600}
body.vA .role{color:var(--txt);opacity:.85}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tags span{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
html.light body.vA .tags span{background:rgba(255,255,255,.7);border-color:var(--line)}

/* actions */
.cta{margin-top:14px;background:var(--wa);color:#03150a;border-radius:22px;padding:15px 16px;display:flex;align-items:center;gap:14px;font-weight:800;box-shadow:0 12px 32px rgba(37,211,102,.25);position:relative;overflow:hidden}
.cta:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.4s infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.cta .ic{width:48px;height:48px;border-radius:15px;background:rgba(0,0,0,.12);display:grid;place-items:center;flex:none}
.cta .ic svg{width:27px;height:27px}
.cta div{flex:1}.cta b{display:block;font-size:18px}.cta small{font-size:13px;font-weight:700;opacity:.75;font-family:Inter;direction:ltr;display:inline-block}
.cta .ar{font-size:22px}
html[dir=ltr] .cta .ar{transform:scaleX(-1)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.btn{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;color:var(--txt)}
.btn svg{width:22px;height:22px;display:block;margin:0 auto 6px;color:var(--gold)}

/* sections */
.sec{margin-top:16px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:10px}
.sh h2{font-size:20px;font-weight:900}
.sh span{font-family:Inter;font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:800;white-space:nowrap}
.sub{color:var(--mut);font-size:14px;line-height:1.8;margin-top:-6px;margin-bottom:12px}

/* cars */
.cars{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}
.cars::-webkit-scrollbar{display:none}
.car{flex:0 0 86%;scroll-snap-align:center;background:var(--card2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gal{position:relative;aspect-ratio:4/3;overflow:hidden;background:#000}
.gal .tr{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .tr::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:.2s}
.dots i.on{width:16px;border-radius:4px;background:#fff}
.badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
html[dir=ltr] .badge{right:auto;left:10px}
.cb{padding:14px}
.cb small{display:block;color:var(--gold);font-family:Inter;font-weight:800;font-size:11px;letter-spacing:2px;direction:ltr;text-align:start}
.cb h3{font-size:19px;font-weight:900;direction:ltr;text-align:start;font-family:Inter,Cairo}
html[dir=rtl] .cb small,html[dir=rtl] .cb h3{text-align:right}
.ct{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.ct span{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.ask{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--gold);color:var(--gold2);background:rgba(207,176,122,.08);border-radius:14px;padding:11px;font-weight:800;font-size:14px;cursor:pointer}
.ask svg{width:18px;height:18px}
.swipe{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}

/* form */
.lab{font-size:13px;color:var(--mut);margin:14px 0 8px;font-weight:600}
input.in{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--txt);font-family:inherit;font-size:15px;outline:none}
input.in:focus{border-color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:9px 13px;font-size:14px;cursor:pointer;transition:.15s}
.opts button.on{background:rgba(207,176,122,.16);border-color:var(--gold);color:var(--gold2);font-weight:800}
.send{margin-top:18px;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;background:linear-gradient(135deg,#e2c792,#b38d4f);color:#1a1408;cursor:pointer;box-shadow:0 10px 26px rgba(207,176,122,.25)}

/* how */
.steps{display:grid;gap:10px}
.st{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border-radius:16px;padding:14px;border:1px solid var(--line)}
.st b{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font-family:Inter;font-weight:800}
.st p{font-size:14px;color:var(--mut);line-height:1.7}.st p strong{color:var(--txt);display:block;font-size:15px}
.show{position:relative;border-radius:20px;overflow:hidden;margin-top:12px;aspect-ratio:4/3}
.show img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.show div{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:14px;line-height:1.7}
.show div b{display:block;font-size:16px}


/* pay */
.pays{display:grid;gap:12px}
.pay{position:relative;border-radius:20px;padding:18px;overflow:hidden;border:1px solid var(--line);color:#fff}
.pay.ip{background:linear-gradient(135deg,#3b1f6e,#6d2a8f 55%,#9a3c7c)}
.pay.vc{background:linear-gradient(135deg,#8e0f12,#d1191f 60%,#e8453c)}
.pay:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);top:-70px;left:-50px}
.pay .ph{display:flex;align-items:center;justify-content:space-between;position:relative}
.pay .nm{font-weight:900;font-size:17px}
.pay .lg{font-family:Inter;font-weight:900;font-size:12px;letter-spacing:2px;opacity:.8}
.pay .val{position:relative;direction:ltr;text-align:left;font-family:Inter;font-weight:800;font-size:20px;letter-spacing:1px;margin:14px 0 12px}
.pay .acts{position:relative;display:flex;gap:8px}
.pay .acts a,.pay .acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px;font-size:14px;font-weight:800;cursor:pointer;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff}
.pay .acts .pr{background:#fff;color:#2a1450;border-color:#fff}
.pay.vc .acts .pr{color:#9b1014}
.pay svg{width:16px;height:16px}
.paynote{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.qrb{text-align:center}
.qrb p{color:var(--mut);font-size:13px;margin-bottom:12px}
#qr{background:#fff;border-radius:16px;padding:10px;width:174px;margin:0 auto}
#qr img,#qr canvas{display:block;margin:auto}
.credit{text-align:center;color:var(--mut);font-size:12px;margin-top:24px}
.credit a{color:var(--gold);font-weight:800}
.fab{position:fixed;bottom:18px;left:18px;z-index:20;width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 8px 24px rgba(37,211,102,.4)}
html[dir=ltr] .fab{left:auto;right:18px}
.fab svg{width:30px;height:30px;color:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
.rv{opacity:0;transform:translateY(16px);transition:.7s}.rv.in{opacity:1;transform:none}
</style>

try{new QRCode(document.getElementById('qr'),{text:location.origin+location.pathname+'?s=q',width:154,height:154,correctLevel:QRCode.CorrectLevel.M})}catch(e){document.getElementById('qr').parentNode.style.display='none'}
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.1}):null;
$('.rv').forEach(function(el){io?io.observe(el):el.classList.add('in')});
(function(){var sp=document.getElementById('splash'),seen=false;try{seen=sessionStorage.getItem('fa_sp')}catch(e){}
 function hide(){sp.classList.add('out');setTimeout(function(){sp.remove()},650)}
 if(seen){sp.remove();return}try{sessionStorage.setItem('fa_sp','1')}catch(e){}
 var n='FATHY ALAA',k=0,el=document.getElementById('sname');sp.onclick=hide;
 var tm=setInterval(function(){el.textContent=n.slice(0,++k);if(k>=n.length){clearInterval(tm);setTimeout(hide,700)}},95)})();
</script>
