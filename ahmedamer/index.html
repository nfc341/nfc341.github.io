*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:transparent;color:var(--tx);font-family:var(--ar);overscroll-behavior-y:none}
body{min-height:100vh}
html[lang=en] body{font-family:var(--en),var(--ar)}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
.ic{width:22px;height:22px;display:block}
.gold-tx{background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent}
.hidden{display:none!important}

/* ===== الخلفية ===== */
.bgphoto{position:fixed;inset:0;z-index:-2;background:var(--photo) center 20%/cover;opacity:.22;filter:grayscale(.25) blur(.5px)}
.bgshade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,10,.35),rgba(10,10,10,.78) 45%,rgba(10,10,10,.96)),radial-gradient(420px 260px at 100% 0,rgba(212,175,55,.14),transparent 70%)}

/* ===== الشعار ===== */
.mono{display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(212,175,55,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mono b{font:900 44px 'Playfair Display',serif;letter-spacing:-6px;margin-right:6px;line-height:1;background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono svg{fill:var(--ac)}
.nm{font-family:var(--en);font-weight:300;color:#fff;direction:ltr;white-space:nowrap}
.nm b{font-weight:800;background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== شاشة الافتتاح ===== */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(11vh + var(--safe-b));
  background:linear-gradient(180deg,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 66%,rgba(0,0,0,.94) 100%),var(--photo) center 30%/cover;
  transition:opacity .8s ease,visibility .8s ease}
#intro.out{opacity:0;visibility:hidden}
#intro .mono{width:104px;height:104px;border-radius:30px;box-shadow:0 0 30px rgba(212,175,55,.2);opacity:0;transform:scale(.7);animation:pop .7s .15s cubic-bezier(.2,1.4,.4,1) forwards}
#intro .mono svg{width:40px;margin-top:4px}
#intro .nm{font-size:clamp(24px,8vw,32px);letter-spacing:.32em;margin-top:18px;clip-path:inset(0 100% 0 0);animation:wipe 1s .45s cubic-bezier(.6,0,.2,1) forwards}
#intro .sub{font:400 11px var(--en);letter-spacing:.8em;color:var(--ac);margin-top:10px;opacity:0;animation:fade .6s 1.1s forwards}
#intro .line{height:1px;width:0;background:var(--gold);margin-top:14px;animation:grow .7s 1s forwards}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{width:160px}}

/* ===== اللغة ===== */
.lang{display:flex;border-radius:99px;overflow:hidden;border:1px solid var(--line);background:rgba(0,0,0,.45);direction:ltr}
.lang button{border:none;background:none;color:var(--mut);font:700 13px var(--ar);padding:6px 13px}
.lang button.on{background:var(--gold);color:var(--onac)}
#intro .lang{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:18px}

/* ===== الرأس ===== */
.app{max-width:520px;margin:0 auto;padding:0 16px calc(100px + var(--safe-b))}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 0 8px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(10,10,10,.92) 70%,rgba(10,10,10,0))}
.brand{display:flex;align-items:center;gap:10px;direction:ltr;user-select:none;-webkit-user-select:none}
.brand .mono{width:44px;height:44px;border-radius:13px}
.brand .mono b{font-size:19px;letter-spacing:-3px;margin-right:3px}
.brand .mono svg{width:18px;margin-top:1px}
.brand .nm{font-size:13px;letter-spacing:.3em}

/* ===== عناصر عامة ===== */
.glass{background:var(--card);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn{border:none;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px;background:var(--gold);color:var(--onac);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.block{width:100%;padding:13px;font-size:15px}
.btn .ic{width:17px;height:17px}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;font-weight:800;font-size:17px}
.sec-t a{font-size:13px;color:var(--ac);font-weight:700;cursor:pointer}
.mut{color:var(--mut)}
.tab{display:none;animation:tabIn .35s ease}
.tab.on{display:block}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.h-scroll::-webkit-scrollbar{display:none}


/* ===== التحية والبروفايل ===== */
.hello{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid;border-image:linear-gradient(90deg,transparent,#d4af37,transparent) 1}
.avatar{width:62px;height:62px;border-radius:18px;overflow:hidden;flex-shrink:0;border:1.5px solid var(--ac);box-shadow:0 0 0 4px rgba(212,175,55,.1)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.hello .who{flex:1;min-width:0}
.hello .greet{font-size:12px;letter-spacing:.3px;color:var(--mut);display:flex;gap:5px;font-weight:600}
.hello h1{font-size:22px;font-weight:900;line-height:1.35}
.hello h1:after{content:" ✦";color:var(--ac);font-size:14px}
.hello .role{font-size:12.5px;color:var(--ac);font-weight:700}

/* ===== الرئيسية ===== */
.near{margin-top:6px;padding:12px 14px;font-size:13.5px;line-height:1.8}
.near b{color:var(--ac)}
.near a{color:var(--ac);font-weight:800;text-decoration:underline;margin-inline-start:4px;cursor:pointer}
.status{margin:12px 2px;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px}
.status i{width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px #2ecc71;animation:blink 2s infinite}
.status.closed i{background:#e74c3c;box-shadow:0 0 8px #e74c3c}
.status small{color:var(--mut);font-weight:400}
@keyframes blink{50%{opacity:.4}}
.social{display:flex;gap:8px;margin-top:10px}
.social a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;font:700 12.5px var(--en);color:var(--tx);text-decoration:none;border-radius:12px}
.social .ic{width:18px;height:18px;color:var(--ac)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.q{padding:13px 0 10px;text-align:center;font-size:12.5px;font-weight:700;color:var(--tx);text-decoration:none;cursor:pointer;transition:transform .12s}
.q:active{transform:scale(.94)}
.q .ic{width:25px;height:25px;color:var(--ac);margin:0 auto 6px}

.svc{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:8px}
.svc .t{flex:1;min-width:0}
.svc .t b{display:block;font-size:15px}
.svc .t small{color:var(--mut);font-size:12px}
.price{font-weight:900;font-size:15.5px;background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

.lockcard{display:flex;align-items:center;gap:11px;padding:13px;border-style:dashed;border-color:var(--ac)}
.lockcard>.ic{width:28px;height:28px;color:var(--ac);flex-shrink:0}
.lockcard div{flex:1}
.lockcard b{display:block;font-size:14px}
.lockcard small{color:var(--mut);font-size:12px}

.gal-item{flex:0 0 140px;height:170px;border-radius:14px;overflow:hidden;scroll-snap-align:start;border:1px solid var(--line);background:var(--card) center/cover;cursor:pointer}
.gal-empty{display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gal-grid .gal-item{height:auto;aspect-ratio:3/4;flex:none}

/* ===== المتجر ===== */
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;margin-top:6px}
.seg button{flex:1;border:none;background:none;color:var(--mut);font-weight:800;font-size:14px;padding:10px;border-radius:10px}
.seg button.on{background:var(--gold);color:var(--onac)}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.prod{overflow:hidden;display:flex;flex-direction:column}
.prod .img{aspect-ratio:1;background:rgba(255,255,255,.04) center/cover;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.prod .img svg{width:54px;height:54px;color:var(--ac);opacity:.75}
.prod .body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .body b{font-size:14px;line-height:1.5}
.prod .body small{color:var(--mut);font-size:11.5px;line-height:1.5;flex:1}
.prod .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.prod .btn{padding:7px 10px;font-size:12.5px}
.h-scroll .prod{flex:0 0 160px;scroll-snap-align:start}
.cart-fab{position:fixed;bottom:calc(88px + var(--safe-b));inset-inline-start:16px;z-index:30;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:99px;border:none;background:var(--gold);color:var(--onac);font-weight:900;font-size:14px;box-shadow:0 8px 24px rgba(212,175,55,.35);transform:scale(0);transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.cart-fab.show{transform:scale(1)}
.cart-fab .ic{width:20px;height:20px}

/* ===== العروض ===== */
.offer{padding:15px;margin-bottom:10px;position:relative;overflow:hidden}
.offer:before{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.22),transparent 70%)}
.offer h3{font-size:16.5px;font-weight:900;margin-bottom:4px}
.offer p{font-size:13px;color:var(--mut);line-height:1.8}
.offer .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.code{font:800 14px var(--en);letter-spacing:2px;padding:7px 12px;border-radius:10px;border:1px dashed var(--ac);color:var(--ac);background:rgba(212,175,55,.08);direction:ltr;cursor:pointer}
.timer{font:700 13px var(--en);color:#ff6b6b;direction:ltr;display:flex;align-items:center;gap:5px}
.timer .ic{width:15px;height:15px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--gold);color:var(--onac);margin-bottom:8px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 4px}
.stamps span{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center}
.stamps span svg{width:55%;height:55%;color:var(--ac);opacity:.45}
.stamps span.free{border:1.5px solid var(--ac);background:rgba(212,175,55,.12)}
.stamps span.free svg{opacity:1}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--tx);font-size:14.5px;outline:none}
.inp:focus{border-color:var(--ac)}
.lock-big{text-align:center;padding:28px 18px}
.lock-big>.ic{width:54px;height:54px;color:var(--ac);margin:0 auto 12px}
.lock-big h3{font-size:18px;font-weight:900;margin-bottom:6px}
.lock-big p{color:var(--mut);font-size:13.5px;line-height:1.9;margin-bottom:16px}
.blur-preview{filter:blur(6px);pointer-events:none;user-select:none;opacity:.55;margin-top:14px}

/* ===== الموقع ===== */
.map{width:100%;height:230px;border:0;border-radius:16px;display:block;filter:invert(.9) hue-rotate(180deg) saturate(.6) contrast(.9)}
.mapwrap{overflow:hidden;padding:0}
.hours{padding:6px 14px}
.hours div{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05)}
.hours div:last-child{border:none}
.hours div.today{color:var(--ac);font-weight:800}
.qr-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

/* ===== الشريط السفلي ===== */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;background:rgba(12,12,12,.86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav .in{display:flex;justify-content:space-around;width:100%;max-width:520px;height:68px;align-items:center}
nav button{border:none;background:none;color:var(--mut);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;position:relative}
nav button .ic{width:23px;height:23px}
nav button.on{color:var(--ac)}
nav button.on:after{content:"";position:absolute;top:-1px;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
nav .dot{position:absolute;top:3px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:#ff4757;box-shadow:0 0 6px #ff4757}

/* ===== النافذة السفلية ===== */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:.25s}
.sheet-bg.show{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;background:#121212;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px 18px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto}
.sheet.show{transform:none}
.sheet-x{position:absolute;top:12px;inset-inline-end:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:22px;line-height:1;display:grid;place-items:center;z-index:2}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#333;margin:0 auto 14px}
.sheet h2{font-size:18px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sheet.full{height:94vh;max-height:94vh}
.qrbox{background:#fff;border-radius:18px;padding:16px;width:min(280px,80vw);margin:6px auto 14px}
.qrbox canvas{width:100%;display:block}
.center{text-align:center}
.cart-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.cart-row div{flex:1}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:17px;font-weight:800}
.steps{line-height:2.1;font-size:14px;padding-inline-start:20px;margin:8px 0 16px}

/* ===== لوحة التحكم ===== */
.adm-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tabs button{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px}
.adm-tabs button.on{background:var(--gold);color:var(--onac);border-color:transparent}
.adm-item{padding:12px;margin-bottom:10px;display:grid;gap:8px}
.adm-item .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm-item label{font-size:11.5px;color:var(--mut);display:block;margin-bottom:3px}
.adm-item .inp{padding:9px 11px;font-size:13.5px}
.adm-item .del{justify-self:start;background:rgba(231,76,60,.15);color:#ff7b6b;border:1px solid rgba(231,76,60,.35)}
.adm-thumb{width:64px;height:64px;border-radius:12px;background:var(--card) center/cover;border:1px solid var(--line);flex-shrink:0;display:grid;place-items:center;color:var(--mut);font-size:11px}
.adm-imgrow{display:flex;gap:10px;align-items:center}
.adm-save{position:sticky;bottom:-24px;background:linear-gradient(180deg,rgba(18,18,18,0),#121212 30%);padding:16px 0 6px;display:flex;gap:8px}
.switch{display:flex;align-items:center;gap:8px;font-size:13px}
.switch input{width:20px;height:20px;accent-color:#d4af37}
.gal-adm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal-adm div{aspect-ratio:1;border-radius:12px;background:center/cover;position:relative;border:1px solid var(--line)}
.gal-adm button{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.7);color:#fff;font-weight:900}

#toast{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;z-index:200;transform:translate(-50%,-30px);opacity:0;transition:.3s;background:var(--gold);color:var(--onac);font-weight:800;font-size:14px;padding:10px 18px;border-radius:99px;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
.credit{text-align:center;font:400 11px var(--en);color:#5f5a50;margin-top:26px;direction:ltr}
.credit a{color:#7d766a;text-decoration:none}
</style>
</head>

const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60 + (m||0); };
const fmtTime = s => { let [h,m] = s.split(":").map(Number); const pm = h >= 12 && h < 24; let hh = h % 12 || 12;
  const tt = (LANG==="ar" ? nf(hh) + (m ? ":" + String(m).padStart(2,"0") : "") : hh + (m ? ":" + String(m).padStart(2,"0") : ""));
  return tt + " " + (LANG==="ar" ? (h<6 ? "بالليل" : h<12 ? "الصبح" : h<15 ? "الضهر" : h<18 ? "العصر" : "بالليل") : (pm ? "PM" : "AM")); };
function openState(){
  const now = new Date(), d = now.getDay(), cur = now.getHours()*60 + now.getMinutes(), H = D.info.hours;
  const span = (day) => { const h = H[day]; if (!h || h.off) return null; let o = toMin(h.open), c = toMin(h.close); if (c <= o) c += 1440; return {o, c, h}; };
  const y = span((d+6)%7); if (y && cur + 1440 < y.c) return {open:true, close:y.h.close};
  const s = span(d); if (s && cur >= s.o && cur < s.c) return {open:true, close:s.h.close};
  if (s && cur < s.o) return {open:false, next:s.h.open};
  for (let i=1;i<=7;i++){ const n = span((d+i)%7); if (n) return {open:false, next:n.h.open, day:(d+i)%7}; }
  return {open:false};
}

function haversine(a,b,c,d){ const R=6371e3, r=x=>x*Math.PI/180; const dl=r(c-a), dn=r(d-b); const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function checkNear(){
  if (!navigator.geolocation || !hasGeo()) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const m = haversine(pos.coords.latitude, pos.coords.longitude, D.info.lat, D.info.lng);
    const el = $("#near"); let msg;
    const dist = m < 1000 ? `<b>${nf(Math.round(m/10)*10)} ${LANG==="ar"?"متر":"m"}</b>` : `<b>${nf((m/1000).toFixed(1))} ${LANG==="ar"?"كيلو":"km"}</b>`;
    if (LANG === "ar"){
      if (m < 60) msg = `✂️ إنت قدام صالون أحمد عامر بالظبط! ادخل، الشاي مستنيك ☕`;

      else if (m < 5000) msg = `💈 إنت على بُعد ${dist} من صالون أحمد عامر.. مشوار صغير وتبقى فل الفل <a data-dir>وصّلني</a>`;
      else msg = `💈 وحشتنا! إنت على بُعد ${dist}.. لما تيجي ناحيتنا عدّي علينا <a data-dir>وصّلني</a>`;
    } else {
      if (m < 60) msg = `✂️ You're right at Ahmed Amer's door! Come in, tea's on us ☕`;
      else if (m < 800) msg = `✂️ You're just ${dist} from Ahmed Amer Barber Shop.. drop by for tea! <a data-dir>Directions</a>`;
      else msg = `💈 You're ${dist} away from Ahmed Amer Barber Shop.. we'd love to see you <a data-dir>Directions</a>`;

    el.innerHTML = msg; el.classList.remove("hidden");

function logoPNG(){
  const c = document.createElement("canvas"); c.width = c.height = 240; const x = c.getContext("2d");
  x.fillStyle = "#0a0a0a"; x.fillRect(0,0,240,240);
  const g = x.createLinearGradient(0,40,0,200); g.addColorStop(0,"#f7e3a1"); g.addColorStop(1,"#c99a35");
  x.strokeStyle = g; x.lineWidth = 6; x.strokeRect(16,16,208,208);
  x.fillStyle = g; x.font = "900 104px 'Playfair Display', Georgia, serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("AA", 120, 108);
  x.save(); x.translate(80,160); x.scale(.8,.8); x.fill(new Path2D("M50 13C44 3 30 1 22 9 16 15 8 19 2 13 4 25 18 33 32 27 40 24 46 19 50 17 54 19 60 24 68 27 82 33 96 25 98 13 92 19 84 15 78 9 70 1 56 3 50 13Z")); x.restore();
  return c.toDataURL("image/jpeg", .85).split(",")[1];
}

function drawQR(text, size=720){
  const q = qrcode(0, "H"); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 4, cell = Math.floor(size/(n+m*2)), S = cell*(n+m*2);
  const c = document.createElement("canvas"); c.width = c.height = S; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0,0,S,S); x.fillStyle = "#0a0a0a";
  for (let r=0;r<n;r++) for (let k=0;k<n;k++) if (q.isDark(r,k)) x.fillRect((k+m)*cell,(r+m)*cell,cell,cell);
  const L2 = Math.round(S*.2), o = (S-L2)/2;
  x.fillStyle = "#fff"; x.fillRect(o-cell,o-cell,L2+cell*2,L2+cell*2);
  x.fillStyle = "#0a0a0a"; x.fillRect(o,o,L2,L2);
  const g = x.createLinearGradient(0,o,0,o+L2); g.addColorStop(0,"#f7e3a1"); g.addColorStop(1,"#c99a35");
  x.fillStyle = g; x.font = `900 ${Math.round(L2*.48)}px 'Playfair Display', Georgia, serif`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("AA", S/2, S/2);
  return c;
}

    if (a==="products") DRAFT.products.push({id:uid("p"), cat:"perfume", ar:"", en:"", price:0, dar:"", den:"", img:""});
    if (a==="offers") DRAFT.offers.push({id:uid("o"), active:true, ar:"", en:"", dar:"", den:"", code:"", ends:""});
    openAdmin(sec); setTimeout(()=>{ const s = $("#sheet"); s.scrollTop = s.scrollHeight; }, 50);
  });
  $("#admSave").onclick = saveDraft;
  $("#admClose").onclick = () => { DRAFT = null; closeSheet(); };
}
function saveDraft(){
  D = DRAFT; DRAFT = null;
  if (Store.save(D)) toast(t("saved")); else toast("المساحة مش كفاية.. صغّر الصور");
  closeSheet(); renderAll();
}
function shrink(file, max){
  return new Promise(res => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement("canvas");
    c.width = Math.round(im.width*s); c.height = Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg", .78)); }; im.src = r.result; }; r.readAsDataURL(file); });
}
function toLocalInput(iso){ const d = new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function fixEnds(d){ d.offers.forEach(o => { if (o.ends === "__ENDS__") o.ends = new Date(Date.now() + 48*36e5).toISOString(); }); }


/* ===== تحية الصبح والمسا ===== */
function renderGreet(){
  const h = new Date().getHours(), morning = h >= 5 && h < 12;
  $("#greet").textContent = LANG === "ar"
    ? (morning ? "☀️ صباح الفل.. نوّرت الصالون" : "🌙 مساء الفل.. نوّرت الصالون")
    : (morning ? "☀️ Good morning, welcome!" : "🌙 Good evening, welcome!");
}

/* ===== التشغيل ===== */
function renderAll(){ renderGreet(); renderStatus(); renderHours(); renderServices(); renderGallery(); renderStore(); renderOffers(); renderLinks(); }
fixEnds(D); if (!localStorage.getItem(Store.key)) Store.save(D);
applyLang();
setInterval(() => { renderStatus(); renderGreet(); }, 60000);

const intro = $("#intro");
const hideIntro = () => { if (intro.classList.contains("out")) return; intro.classList.add("out"); setTimeout(checkNear, 700); };
setTimeout(hideIntro, 2600);
intro.addEventListener("click", hideIntro);
</script>
