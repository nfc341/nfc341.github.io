<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحة تجريبية 2</title>
<meta name="theme-color" content="#faf6ef">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script>
/* ===== بيانات صاحب الصفحة: عدّل هنا بس ===== */
var CARD = {
  name: "سارة علي",
  title: "صاحبة متجر أونلاين",
  bio: "اكتب هنا نبذة قصيرة عن صاحب الصفحة وشغله.",
  photo: "",                     // لينك صورة (اختياري). لو فاضي يظهر أول حرف من الاسم
  phone: "01000000000",          // للاتصال وحفظ جهة الاتصال
  whatsapp: "201000000000",      // بالكود الدولي من غير +
  telegram: "",                  // اسم المستخدم من غير @
  facebook: "https://facebook.com/",
  instagram: "https://instagram.com/",
  tiktok: "",
  email: "name@example.com",
  location: "",                  // لينك جوجل ماب (اختياري)
  instapay: "name@instapay",
  vodafoneCash: "01000000000",
  accent: "#b8862e",
  accent2: "#e0b45c",
  bg: "#faf6ef",
  card: "#ffffff",
  text: "#2b2116",
  muted: "#7a6a55"
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:22px 14px 40px}
.wrap{width:100%;max-width:430px}
.head{text-align:center;padding:14px 8px 18px}
.av{width:118px;height:118px;border-radius:50%;margin:0 auto 14px;padding:4px;background:linear-gradient(135deg,var(--a),var(--a2))}
.av>*{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:#fff;background:var(--a);border:3px solid var(--bg)}
h1{font-size:26px;font-weight:800;color:var(--t)}
.role{margin-top:4px;color:var(--a);font-weight:700}
.bio{margin-top:10px;color:var(--m);font-size:14px;line-height:1.8}
.sec{font-size:13px;color:var(--m);margin:18px 4px 8px;font-weight:700}
.links{display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border-radius:16px;text-decoration:none;color:var(--t);font:600 16px 'Cairo',sans-serif;border:1px solid var(--line);background:var(--c);cursor:pointer;text-align:start}
.btn:active{transform:scale(.98)}
.btn .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.btn .ic svg{width:22px;height:22px;fill:currentColor}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--m);direction:ltr;text-align:right}
.main{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;border:0;justify-content:center;font-weight:800}
.main svg{width:22px;height:22px;fill:#fff;flex-shrink:0}
.box{background:var(--c);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--t);font:700 14px 'Cairo';cursor:pointer}
.tab.on{background:var(--a);color:#fff;border-color:transparent}
.pane{display:none}.pane.on{display:block}
.addr{direction:ltr;font-weight:800;font-size:18px;margin:6px 0 12px;color:var(--a)}
.qr{background:#fff;border-radius:14px;padding:8px;width:170px;margin:8px auto}
.hint{font-size:12.5px;color:var(--m)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--a);color:#fff;padding:10px 22px;border-radius:30px;font-weight:700;transition:transform .25s}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--m);font-size:12px;margin-top:22px;opacity:.7}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
var C=CARD,r=document.documentElement.style;
r.setProperty('--a',C.accent);r.setProperty('--a2',C.accent2);r.setProperty('--bg',C.bg);r.setProperty('--c',C.card);r.setProperty('--t',C.text);r.setProperty('--m',C.muted);r.setProperty('--line','rgba(128,128,128,.18)');
document.body.style.background=C.bg;document.title=C.name;
var I={
 wa:'<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3z"/>',
 tg:'<path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.8-7.9c.4-.3-.1-.5-.6-.2L6.6 13.3 2 11.9c-1-.3-1-1 .2-1.5l18.2-7c.8-.3 1.6.2 1.5 1z"/>',
 ph:'<path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>',
 fb:'<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H8v4h2v8h4v-8h3l1-4h-4V8.5c0-.3.2-.5.5-.5z"/>',
 ig:'<path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM16 2H8a6 6 0 0 0-6 6v8a6 6 0 0 0 6 6h8a6 6 0 0 0 6-6V8a6 6 0 0 0-6-6zm4 14a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4z"/>',
 tt:'<path d="M16.6 2h-3.3v13.3a2.8 2.8 0 1 1-2-2.7V9.2a6.2 6.2 0 1 0 5.3 6.1V8.6a8 8 0 0 0 4.4 1.4V6.6a4.5 4.5 0 0 1-4.4-4.6z"/>',
 em:'<path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/>',
 mp:'<path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>',
 ad:'<path d="M15 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2zm9 4c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/>'
};
function svg(k){return '<svg viewBox="0 0 24 24">'+I[k]+'</svg>'}
function link(href,app,ic,col,label,sub){return '<a class="btn" href="'+href+'"'+(app?' data-app="'+app+'"':'')+' target="_blank" rel="noopener"><span class="ic" style="background:'+col+'">'+svg(ic)+'</span><span><span>'+label+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</span></a>'}
var h='<div class="head"><div class="av">'+(C.photo?'<img src="'+C.photo+'" alt="">':'<div>'+C.name.trim().charAt(0)+'</div>')+'</div><h1>'+C.name+'</h1><div class="role">'+C.title+'</div>'+(C.bio?'<p class="bio">'+C.bio+'</p>':'')+'</div>';
h+='<div class="links"><button class="btn main" onclick="saveContact()">'+svg('ad')+'<span>حفظ جهة الاتصال</span></button>';
if(C.whatsapp)h+=link('https://wa.me/'+C.whatsapp,'whatsapp://send?phone='+C.whatsapp,'wa','#1fa855','واتساب',C.phone);
if(C.phone)h+=link('tel:'+C.phone,'','ph',C.accent,'اتصال',C.phone);
if(C.telegram)h+=link('https://t.me/'+C.telegram,'tg://resolve?domain='+C.telegram,'tg','#229ed9','تليجرام','@'+C.telegram);
h+='</div>';
var soc='';
if(C.facebook)soc+=link(C.facebook,'','fb','#1877f2','فيسبوك','');
if(C.instagram)soc+=link(C.instagram,'','ig','#d62976','إنستجرام','');
if(C.tiktok)soc+=link(C.tiktok,'','tt','#111','تيك توك','');
if(C.email)soc+=link('mailto:'+C.email,'','em','#ea4335','الإيميل',C.email);
if(C.location)soc+=link(C.location,'','mp','#34a853','العنوان على الخريطة','');
if(soc)h+='<div class="sec">حساباتي</div><div class="links">'+soc+'</div>';
if(C.instapay||C.vodafoneCash){
 h+='<div class="sec">الدفع</div><div class="box"><div class="tabs">';
 if(C.instapay)h+='<button class="tab" data-p="ip">إنستاباي</button>';
 if(C.vodafoneCash)h+='<button class="tab" data-p="vf">فودافون كاش</button>';
 h+='</div>';
 if(C.instapay)h+='<div class="pane" id="p-ip"><div class="addr">'+C.instapay+'</div><button class="btn main" onclick="cp(\''+C.instapay+'\')">نسخ عنوان الدفع</button></div>';
 if(C.vodafoneCash)h+='<div class="pane" id="p-vf"><div class="addr" style="color:#e60000">'+C.vodafoneCash+'</div><button class="btn main" style="background:#e60000" onclick="cp(\''+C.vodafoneCash+'\')">نسخ رقم المحفظة</button></div>';
 h+='</div>';
}
h+='<div class="sec">شارك الصفحة</div><div class="box"><div class="hint">موبايلك مافيهوش NFC؟ امسح الكود بالكاميرا</div><div class="qr" id="qr"></div></div><footer>'+C.name+'</footer>';
document.getElementById('app').innerHTML=h;
var tabs=document.querySelectorAll('.tab');
function pay(k){tabs.forEach(function(t){t.classList.toggle('on',t.dataset.p==k)});document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id=='p-'+k)})}
tabs.forEach(function(t){t.onclick=function(){pay(t.dataset.p)}});if(tabs[0])pay(tabs[0].dataset.p);
try{new QRCode(document.getElementById('qr'),{text:location.href.split('#')[0],width:154,height:154,correctLevel:QRCode.CorrectLevel.M})}catch(e){var q=document.getElementById('qr').parentNode;q.previousSibling.style.display='none';q.style.display='none'}
window.cp=function(t){var d=function(){var x=document.getElementById('toast');x.textContent='تم النسخ';x.classList.add('show');setTimeout(function(){x.classList.remove('show')},1600)};try{navigator.clipboard.writeText(t).then(d,d)}catch(e){d()}};
window.saveContact=function(){var v=['BEGIN:VCARD','VERSION:3.0','FN:'+C.name,'TITLE:'+C.title,C.phone?'TEL;TYPE=CELL:'+C.phone:'',C.email?'EMAIL:'+C.email:'','URL:'+location.href.split('#')[0],'END:VCARD'].filter(Boolean).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download=C.name+'.vcf';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000)};
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-app]');if(!a||!/Android|iPhone|iPad/i.test(navigator.userAgent))return;e.preventDefault();var w=a.href,left=false,f=function(){if(document.hidden)left=true};document.addEventListener('visibilitychange',f);location.href=a.getAttribute('data-app');setTimeout(function(){document.removeEventListener('visibilitychange',f);if(!left)location.href=w},1500)});
})();
</script>
</body>
</html>
