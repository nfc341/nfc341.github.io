html.dark .bgimg{opacity:.42}
.bgfade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 0%,transparent 25%,var(--bg) 80%)}
.wrap{width:100%;max-width:430px}
.top{display:flex;justify-content:space-between;align-items:center}
.greet{font-size:14px;font-weight:600;color:var(--t)}
.tools{display:flex;gap:8px}
.ic-btn,.lang{height:38px;min-width:38px;border-radius:20px;background:var(--c);border:1px solid var(--line);color:var(--t);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);font:600 13px inherit;font-family:inherit;padding:0 12px}
.head{text-align:center;padding:18px 8px 14px}
.av{width:124px;height:124px;border-radius:50%;margin:0 auto 14px;padding:4px;background:conic-gradient(var(--a),var(--a2),var(--a));animation:spin 8s linear infinite}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--bg);animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:28px;font-weight:800;direction:ltr;display:flex;align-items:center;justify-content:center;gap:8px}
h1 svg{width:24px;height:24px}
.role{margin-top:4px;color:var(--a);font-weight:700;direction:ltr;letter-spacing:.5px}
.sec{font-size:13px;color:var(--m);margin:18px 4px 8px;font-weight:700}
.links{display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border-radius:16px;text-decoration:none;color:var(--t);font:600 16px inherit;font-family:inherit;border:1px solid var(--line);background:var(--c);cursor:pointer;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(80,60,20,.06)}
.btn:active{transform:scale(.98)}
.btn .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.btn .ic svg{width:22px;height:22px;fill:#fff}
.btn .tx{flex:1;text-align:start}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--m);direction:ltr;text-align:start}
html[dir=rtl] .btn small{text-align:right}
.main{background:linear-gradient(90deg,var(--a),var(--a2));color:#fff;border:0;justify-content:center;font-weight:800}
.main svg{width:22px;height:22px;fill:#fff}
.box{background:var(--c);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;backdrop-filter:blur(10px)}
.vf{width:56px;height:56px;border-radius:50%;background:#e60000;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.vf svg{width:30px;height:30px;fill:#fff}
.addr{direction:ltr;font-weight:800;font-size:20px;margin:4px 0 12px;color:#d40000}
.qr{background:#fff;border-radius:14px;padding:8px;width:170px;margin:8px auto}
.hint{font-size:12.5px;color:var(--m)}
.fab{position:fixed;bottom:20px;left:18px;z-index:20;width:58px;height:58px;border-radius:50%;background:#1fa855;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(31,168,85,.45);animation:pulse 2.4s infinite}
.fab svg{width:30px;height:30px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,168,85,.55)}70%{box-shadow:0 0 0 14px rgba(31,168,85,0)}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--a);color:#fff;padding:10px 22px;border-radius:30px;font-weight:700;transition:transform .25s;z-index:30}
.toast.show{transform:translateX(-50%) translateY(0)}
.credit{text-align:center;margin-top:26px;font-size:11.5px;color:var(--m);opacity:.75}
.credit a{color:var(--a);text-decoration:none;font-weight:700}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .code{font:600 14px 'Inter',monospace;color:var(--a);direction:ltr;opacity:.85;letter-spacing:2px}
#splash .nm{font:800 34px 'Inter',sans-serif;direction:ltr;min-height:44px;background:linear-gradient(90deg,var(--a2),#fff3d6,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .nm:after{content:"|";color:var(--a);-webkit-text-fill-color:var(--a);animation:blink .8s infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
h1 .gold{background:linear-gradient(90deg,var(--a2),#fff3d6,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
